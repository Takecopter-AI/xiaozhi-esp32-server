# Docker安装Server

services:
  nginx:
    image: nginx:alpine
    container_name: xiaozhi-esp32-server-nginx
    depends_on:
      - xiaozhi-esp32-server
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-8008}:8080"
      - "${NGINX_HTTPS_PORT:-8443}:8443"
      - "${NGINX_WS_PORT:-18080}:18080"
      - "${NGINX_WSS_PORT:-18443}:18443"
    environment:
      - NGINX_HTTP_UPSTREAM=xiaozhi-esp32-server:8003
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-8443}
      - NGINX_WSS_PORT=${NGINX_WSS_PORT:-18443}
    volumes:
      - ${NGINX_CONFIG_TEMPLATE:-./nginx/default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ${NGINX_SSL_CERTIFICATE:?Run setup.sh to configure the certificate path}:/etc/nginx/ssl/fullchain.pem:ro
      - ${NGINX_SSL_CERTIFICATE_KEY:?Run setup.sh to configure the certificate key path}:/etc/nginx/ssl/privkey.pem:ro

  xiaozhi-esp32-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
    ports:
      # ws服务端
      - "8000:8000"
      # http服务的端口，用于简单OTA接口(单服务部署)，以及视觉分析接口
      - "8003:8003"
    volumes:
      # 配置文件目录
      - ./data:/opt/xiaozhi-esp32-server/data
      # 模型文件挂接，很重要
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
